[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analytics-agent"
version = "0.1.0"
description = "Reproducible Olist analytics, delivery prediction, retrieval, and read-only agent"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<25",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.21,<1",
    "sqlglot>=26,<30",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
pipeline = ["prefect>=3.1,<4"]
ml = ["mlflow>=2.17,<4"]
search = ["chromadb>=1,<2", "sentence-transformers>=3,<6"]
agent = ["openai>=1.50,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
olist = "olist_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"